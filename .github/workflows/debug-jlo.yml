name: Debug JLO (temporary)

on:
  workflow_dispatch: {}
  push:
    branches: [claude/debug-jlo]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: rugby data update -t japan-league-one --dry-run
